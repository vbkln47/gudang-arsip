<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBK portofolio</title>
</head>
<body>
  <style>
.button {
  display: inline-block;
  padding: 15px 25px;
  font-size: 24px;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  color: #fff;
  background-color: #04AA6D;
  border: none;
  border-radius: 15px;
  box-shadow: 0 9px #999;
}
.button:hover {box-shadow:0 8px 16px 0 rgba(0,0,0,0.6)}
.button:active {
  box-shadow: 0 5px #666;
  transform: translateY(4px);
}
</style>
    <h1>Hello World!</h1>
    <p>This is a paragraph inside an HTML file.</p>
  <button class="button">Click Me!</button>
</body>
</html>
